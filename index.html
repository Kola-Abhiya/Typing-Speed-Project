<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Speed Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-gray-900 text-white min-h-screen flex flex-col justify-center items-center"
  >
    <div
      id="app"
      class="text-center p-6 bg-gray-800 rounded-lg shadow-lg max-w-4xl"
    >
      <h1 class="text-3xl font-bold text-blue-400 mb-4">Typing Speed Test</h1>
      <p id="instructions" class="text-gray-300">
        Type the following text as quickly and accurately as possible:
      </p>
      <div
        id="sentence-container"
        class="mt-4 p-4 border border-gray-700 bg-gray-700 rounded-lg"
      >
        <p id="sentence" class="text-xl text-blue-300">Loading...</p>
      </div>
      <textarea
        id="user-input"
        placeholder="Start typing here..."
        class="mt-4 w-full p-4 rounded-lg bg-gray-800 border border-gray-600 text-gray-300 focus:outline-none focus:border-blue-500"
        disabled
      ></textarea>
      <button
        id="start-btn"
        class="mt-4 bg-blue-500 hover:bg-blue-400 text-white py-2 px-4 rounded-lg font-semibold transition-all"
      >
        Start Test
      </button>
      <div id="results" class="mt-6 hidden">
        <p>
          Time Taken:
          <span id="time-taken" class="font-bold text-blue-400">0.00</span>
          seconds
        </p>
        <p>
          Words Per Minute (WPM):
          <span id="wpm" class="font-bold text-blue-400">0</span>
        </p>
        <p>
          Accuracy:
          <span id="accuracy" class="font-bold text-blue-400">0%</span>
        </p>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js" defer></script>
  </body>
</html>
